name: Test Playwright dettagliato

on:
  workflow_dispatch:

jobs:
  test-playwright:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Installa Playwright con verbose
      run: |
        echo "📦 Installazione Playwright..."
        pip install playwright --verbose
        echo "✅ Playwright installato!"
        echo "📦 Installazione Chromium..."
        playwright install chromium --verbose
        echo "✅ Chromium installato!"
        echo "📦 Installazione dipendenze..."
        playwright install-deps
        echo "✅ Tutto installato!"
    
    - name: Test Playwright
      run: |
        python -c "
        from playwright.sync_api import sync_playwright
        print('🔍 Avvio Playwright...')
        try:
            with sync_playwright() as p:
                print('✅ Playwright avviato!')
                browser = p.chromium.launch(headless=True)
                print('✅ Browser avviato!')
                page = browser.new_page()
                print('✅ Nuova pagina creata!')
                page.goto('https://google.com', timeout=10000)
                print(f'✅ Pagina caricata! Titolo: {page.title()}')
                browser.close()
                print('✅ Test completato!')
        except Exception as e:
            print(f'❌ ERRORE: {e}')
        "
