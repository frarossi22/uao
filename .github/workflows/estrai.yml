name: Test Playwright con file

on:
  workflow_dispatch:

jobs:
  test-playwright:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Installa Playwright
      run: |
        pip install playwright
        playwright install chromium
        playwright install-deps
    
    - name: Crea script di test
      run: |
        cat > test_playwright.py << 'EOF'
        from playwright.sync_api import sync_playwright
        
        print("Script avviato!")
        
        try:
            with sync_playwright() as p:
                print("Playwright avviato!")
                browser = p.chromium.launch(headless=True)
                print("Browser avviato!")
                page = browser.new_page()
                page.goto('https://google.com')
                print(f"Titolo: {page.title()}")
                browser.close()
                print("Test completato!")
        except Exception as e:
            print(f"ERRORE: {e}")
        EOF
    
    - name: Esegui script
      run: python test_playwright.py
