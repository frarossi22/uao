name: Estrai MPD Sky

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Esegui script
        run: python script.py

      - name: Upload playlist su Google Drive
        uses: adityak74/upload-google-drive-action@v1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          file: playlist.m3u
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
