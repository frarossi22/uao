name: Esecuzione script estrai

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  esegui-estrazione:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Installa dipendenze
      run: |
        pip install --upgrade pip
        pip install google-auth google-auth-oauthlib google-api-python-client pandas
    
    - name: Crea file di credenziali
      run: |
        python -c "
        import os, json
        creds = {'installed': {'client_id': os.environ['GDRIVE_CLIENT_ID'], 'client_secret': os.environ['GDRIVE_CLIENT_SECRET'], 'auth_uri': 'https://accounts.google.com/o/oauth2/auth', 'token_uri': 'https://oauth2.googleapis.com/token', 'redirect_uris': ['http://localhost']}}
        with open('credentials.json', 'w') as f: json.dump(creds, f)
        token = {'refresh_token': os.environ['GDRIVE_REFRESH_TOKEN'], 'client_id': os.environ['GDRIVE_CLIENT_ID'], 'client_secret': os.environ['GDRIVE_CLIENT_SECRET'], 'token_uri': 'https://oauth2.googleapis.com/token'}
        with open('token.json', 'w') as f: json.dump(token, f)
        "
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    
    - name: Esegui script
      run: python script.py
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    
    - name: Carica risultati
      uses: actions/upload-artifact@v4
      with:
        name: risultati-estrazione
        path: |
          *.csv
          *.xlsx
        retention-days: 7
