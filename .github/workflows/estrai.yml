name: Test Playwright con output forzato

on:
  workflow_dispatch:

jobs:
  test-playwright:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Installa Playwright
      run: |
        pip install playwright
        playwright install chromium
        playwright install-deps
    
    - name: Test con output immediato
      run: |
        python -u -c "
        import sys
        from playwright.sync_api import sync_playwright
        
        sys.stdout.write('🔍 Avvio test...\n')
        sys.stdout.flush()
        
        try:
            sys.stdout.write('📦 Avvio Playwright...\n')
            sys.stdout.flush()
            with sync_playwright() as p:
                sys.stdout.write('🌐 Avvio browser...\n')
                sys.stdout.flush()
                browser = p.chromium.launch(headless=True)
                sys.stdout.write('✅ Browser avviato!\n')
                sys.stdout.flush()
                
                page = browser.new_page()
                sys.stdout.write('⏳ Caricamento google.com...\n')
                sys.stdout.flush()
                
                page.goto('https://google.com', timeout=30000)
                sys.stdout.write(f'✅ Pagina caricata! Titolo: {page.title()}\n')
                sys.stdout.flush()
                
                browser.close()
                sys.stdout.write('✅ Test completato con successo!\n')
                sys.stdout.flush()
        except Exception as e:
            sys.stdout.write(f'❌ ERRORE: {e}\n')
            sys.stdout.flush()
        "
