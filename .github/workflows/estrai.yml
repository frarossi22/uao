name: Test Playwright con timeout

on:
  workflow_dispatch:

jobs:
  test-playwright:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Installa Playwright
      run: |
        pip install playwright
        playwright install chromium
        playwright install-deps
    
    - name: Test con timeout 60s
      run: |
        python -c "
        from playwright.sync_api import sync_playwright
        import time
        
        url = 'https://uaznao.com/premium/canalitv/cinema1.php'
        print('🔍 Avvio test...')
        
        try:
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=True)
                page = browser.new_page()
                print('⏳ Caricamento pagina (timeout 60s)...')
                page.goto(url, timeout=60000, wait_until='domcontentloaded')
                print('✅ Pagina caricata!')
                content = page.content()
                print(f'📄 Contenuto: {len(content)} caratteri')
                browser.close()
                print('✅ Test completato!')
        except Exception as e:
            print(f'❌ ERRORE: {e}')
        "
