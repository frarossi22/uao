name: Test Python base

on:
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Test semplice Python
      run: |
        echo "Inizio test Python..."
        python --version
        python -c "print('Hello World!')"
        echo "Fine test"
