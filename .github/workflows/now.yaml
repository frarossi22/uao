name: UazNao

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine curl_cffi cryptography construct pymp4
          pip install google-api-python-client google-auth

      - name: Prepara credenziali Google
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_uaonow }}' > uaonow/now/service_account.json

      - name: Esegui now.py
        run: |
          cd uaonow/now
          python now.py --all

      - name: Carica su Google Drive
        run: |
          cd uaonow/now
          python upload_to_drive.py
