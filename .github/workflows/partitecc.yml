name: Partite.cc Scraper ITALY

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: partite.cc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Ricrea client_secret.json
        working-directory: partite.cc
        run: echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Ricrea token.json
        working-directory: partite.cc
        run: echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Esegui scraper
        working-directory: partite.cc
        run: python partite.cc_auto.py
