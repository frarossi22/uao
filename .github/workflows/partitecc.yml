name: Partite.cc Scraper ITALY

on:
  schedule:
    # Esegue ogni 10 minuti
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: partite.cc
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Install Playwright Chromium with Dependencies
        working-directory: partite.cc
        run: |
          playwright install chromium --with-deps

      - name: Create credentials files securely
        working-directory: partite.cc
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_SECRET: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET" > client_secret.json
          echo "$TOKEN_SECRET" > token.json

      - name: Run scraper
        working-directory: partite.cc
        run: python partite.cc_auto.py
