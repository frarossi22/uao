name: Partite.cc Scraper ITALY

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: partite.cc
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Install Playwright Chromium
        working-directory: partite.cc
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Create client_secret.json from secrets
        working-directory: partite.cc
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Create token.json from secrets
        working-directory: partite.cc
        run: |
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Run scraper in loop (51 cycles x 7 min = 6 hours)
        working-directory: partite.cc
        run: |
          for i in $(seq 1 51); do
            echo "═══════════════════════════════════════"
            echo "  Ciclo $i di 51 - $(date -u +%H:%M:%S) UTC"
            echo "═══════════════════════════════════════"
            python partite.cc_auto.py || echo "Ciclo $i fallito, continuo..."
            if [ $i -lt 51 ]; then
              echo "Attendo 7 minuti..."
              sleep 420
            fi
          done
          echo "═══════════════════════════════════════"
          echo "  Completati 51 cicli (6 ore), lavoro finito"
          echo "═══════════════════════════════════════"
