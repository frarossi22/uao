name: Partite.cc Scraper ITALY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: partite.cc
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Install Playwright Chromium
        working-directory: partite.cc
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Create client_secret.json from secrets
        working-directory: partite.cc
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Create token.json from secrets
        working-directory: partite.cc
        run: |
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Run scraper in loop (4 ore)
        working-directory: partite.cc
        run: |
          # 4 ore = 14400 secondi
          END_TIME=$(($(date +%s) + 14400))
          i=0
          while [ $(date +%s) -lt $END_TIME ]; do
            i=$((i+1))
            echo "═══════════════════════════════════════"
            echo "  Ciclo $i - $(date -u +%H:%M:%S) UTC"
            echo "═══════════════════════════════════════"
            python partite.cc_auto.py || echo "Ciclo $i fallito, continuo..."
            sleep 180
          done
          echo "═══════════════════════════════════════"
          echo "  Completate 4 ore, prossimo job in arrivo"
          echo "═══════════════════════════════════════"
