name: Sky & DAZN Scraper

on:
  schedule:
    - cron: '0 7 * * *'    # Primo avvio alle 09:00 ora italiana (07:00 UTC)
    - cron: '30 12 * * *'  # Secondo avvio alle 14:30 ora italiana (12:30 UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2023

    steps:
    - name: Install system packages, tar and dependencies
      run: |
        yum update -y
        yum install -y tar gzip wget unzip python3 python3-pip nss gtk3 libX11 alsa-lib libglvnd-glx liberation-fonts

    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
        yum install -y ./google-chrome-stable_current_x86_64.rpm
        rm google-chrome-stable_current_x86_64.rpm

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Python dependencies
      run: |
        pip3 install requests selenium webdriver-manager

    - name: Run scraper
      env:
        CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        DRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
      run: |
        python3 "46canali e 10dazn selenum.py"
