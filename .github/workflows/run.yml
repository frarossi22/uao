name: DAZN & Sky Scraper

on:
  schedule:
    - cron: '0 8 * * *'  # Ogni giorno alle 8:00
  workflow_dispatch:      # Permette esecuzione manuale

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager requests
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Setup Microsoft Edge
      run: |
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
        sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
        sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge-stable.list'
        sudo apt-get update
        sudo apt-get install -y microsoft-edge-stable

    - name: Run scraper
      env:
        CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        DRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
      run: |
        xvfb-run -a python 46canali_e_10dazn_selenum.py
