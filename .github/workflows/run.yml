name: Sky & DAZN Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run scraper
      env:
        CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        DRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
      run: |
        python scraper_46_canali_skympd.m3u_auto_google_drive_solo_android_android.py
