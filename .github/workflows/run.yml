name: DAZN & Sky Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager requests
        # Questa action gestisce anche xvfb automaticamente
        sudo apt-get update
        sudo apt-get install -y xvfb

    # ACTION DEDICATA PER EDGE (PIÙ STABILE)
    - name: Setup Microsoft Edge and WebDriver
      uses: browser-actions/setup-edge@v1

    - name: Run scraper
      env:
        CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        DRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
      run: |
        xvfb-run -a python 46canali_e_10dazn_selenum.py
