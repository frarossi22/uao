name: Avvio Automatico Script

on:
  schedule:
    # Esegue lo script ogni giorno alle 09:00 ora italiana (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permette l'avvio manuale con un click

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui lo script Python
        run: python "scraper_46_canali_skympd.m3u_auto_google_drive_solo_android_android.py"
