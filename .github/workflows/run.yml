name: Avvio Automatico Script

on:
  schedule:
    # Esegue lo script ogni giorno alle 09:00 ora italiana (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permette di avviarlo anche a mano quando vuoi

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          # Se il tuo script usa librerie esterne, togli il # dalla riga sotto e aggiungile:
          # pip install requests pandas beautifulsoup4

      - name: Esegui lo script Python
        run: python scraper 46 canali skympd.m3u auto google drive solo android-android.py  # Sostituisci "script.py" con il nome esatto del tuo file .py
