name: Sky & DAZN Scraper (Yum)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2023

    steps:
    - name: Install tar and system packages
      run: |
        yum update -y
        yum install -y tar gzip python3 python3-pip

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Python dependencies
      run: |
        pip3 install requests

    - name: Run scraper
      env:
        CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        DRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
      run: |
        python3 scraper_46_canali_skympd.m3u_auto_google_drive_solo_android_android.py
